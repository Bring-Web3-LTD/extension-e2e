[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# The browser fixture is session-scoped (one per worker lane), so the
# loop has to outlive a single test or the context is closed under it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts =
    -v
    --tb=short
    --strict-markers

# A ceiling per test, so a hang fails one check instead of stalling the run.
# Every wait in the suite is bounded well under this, so hitting it means
# something stopped answering - a page that never finished loading, a service
# worker that went away mid-call. Without it a single stuck navigation ran for
# an hour and reported nothing at all, which is the worst outcome for a check
# somebody is waiting on before a release.
timeout = 240
timeout_method = thread

markers =
    popup: offer popup on a retailer page
    notification: reward notification
    offerbar: the offer bar / top bar over search results
    widget: the collapsed badge and the offer behind it
    followups: server-armed navigation watchers
    concurrent: several tabs open at once in one browser
    storage: saved bring_* state
    robustness: recovery, permissions, logging
    needs_db: needs a seeded purchases row; skipped when no DB
