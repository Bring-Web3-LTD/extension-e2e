[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# The browser fixture is session-scoped (one per worker lane), so the
# loop has to outlive a single test or the context is closed under it.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts =
    -v
    --tb=short
    --strict-markers

markers =
    popup: offer popup on a retailer page
    notification: reward notification
    offerbar: the offer bar / top bar over search results
    widget: the collapsed badge and the offer behind it
    followups: server-armed navigation watchers
    concurrent: several tabs open at once in one browser
    storage: saved bring_* state
    robustness: recovery, permissions, logging
    needs_db: needs a seeded purchases row; skipped when no DB
