# The button you press before publishing.
#
#   GitHub -> Actions -> "Release check" -> Run workflow
#
# Brings up a temporary environment from the branches you name, loads the
# extension that environment built, and runs everything against it. Nothing
# here runs on its own: no push trigger, no schedule. It is a decision, and
# somebody makes it.
#
# About half an hour. You do not have to watch it — the summary at the top of
# the run says PASS or exactly what broke, and the screenshots, traces and
# storage dumps for every failure are attached to the run.

name: Release check

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: 'bringweb3 branch to deploy'
        required: true
        default: 'main'
      frontend_branch:
        description: 'chromeExtension branch to deploy'
        required: true
        default: 'main'
      environment_name:
        description: 'Temporary environment to use or create'
        required: true
        default: 'qa-extension'
      retailers:
        description: 'Shops to test, comma separated (blank = the default four)'
        required: false
        default: ''
      scope:
        description: 'How much to run'
        required: true
        default: 'everything'
        type: choice
        options:
          - everything
          - popup and widget only
          - the walk only

permissions:
  id-token: write        # OIDC to AWS
  contents: read

jobs:
  # Four machines, a quarter of the checks each. Nothing about a test changes —
  # there are simply four browsers' worth of waiting happening at once instead
  # of one. The suite spends almost all of its time waiting on real shops, so
  # this is the only lever that moves the wall clock without giving something
  # up.
  #
  # The environment is shared: whichever shard gets there first deploys it, the
  # rest find it up and reuse it. That is the same race two people running the
  # tool at once already produce, and `Environment.ensure` was written for it.
  check:
    name: Shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 75

    strategy:
      # One shard failing is a result, not a reason to abandon the other three.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      BRING_SHARD: ${{ matrix.shard }}
      BRING_SHARDS: '4' 

      BRING_ENV_NAME: ${{ github.event.inputs.environment_name }}
      BRING_BACKEND_BRANCH: ${{ github.event.inputs.backend_branch }}
      BRING_FRONTEND_BRANCH: ${{ github.event.inputs.frontend_branch }}
      BRING_RETAILERS: ${{ github.event.inputs.retailers }}
      BRING_HEADLESS: '1'
      ECKO_API_KEY: ${{ secrets.ECKO_API_KEY }}
      AWS_REGION: eu-central-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: extension-e2e

      # Only needed to seed the notification variants. Without it those tests
      # skip with a reason and everything else runs, so it is optional rather
      # than a hard requirement.
      #
      # The key is read from `env`, not tested directly in `if`. The `secrets`
      # context is not available to an `if` expression, and the failure is not
      # a skipped step: the workflow will not parse, every job is dropped, and
      # the run reports "No jobs were run" with nothing to point at.
      - name: Database tunnel key
        env:
          DB_SSH_KEY: ${{ secrets.DB_SSH_KEY }}
          DB_SSH_HOST: ${{ secrets.DB_SSH_HOST }}
          DB_SSH_USER: ${{ secrets.DB_SSH_USER }}
        if: ${{ env.DB_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DB_SSH_KEY" > ~/.ssh/bring-db.pem
          chmod 600 ~/.ssh/bring-db.pem
          {
            echo "DB_SSH_HOST=$DB_SSH_HOST"
            echo "DB_SSH_USER=$DB_SSH_USER"
            echo "DB_SSH_PORT=22"
            echo "DB_SSH_KEY_PATH=$HOME/.ssh/bring-db.pem"
          } >> "$GITHUB_ENV"

      # The environment is brought up once, here, and reused by both runs
      # below. Deploying it twice would mean waiting out the domain caches
      # twice for no gain.
      - name: The suite
        id: suite
        if: ${{ github.event.inputs.scope != 'the walk only' }}
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.scope }}" = "popup and widget only" ]; then
            python -u run.py --headless -n 4 -m "popup or widget" | tee suite.log
          else
            python -u run.py --headless -n 4 | tee suite.log
          fi

      # Only on the first shard. The walk drives all four shops together in one
      # browser by design, so it cannot be split — and running it on every
      # shard would be the same journey four times, four times the traffic to
      # the same shops, for no extra information.
      - name: The walk — every shop in step, in one browser
        # (shard 1 only; see above)
        id: walk
        if: ${{ github.event.inputs.scope != 'popup and widget only' && matrix.shard == 1 }}
        continue-on-error: true
        run: python -u flow.py --headless | tee walk.log

      - name: What happened
        if: always()
        run: |
          {
            echo "## Release check"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| environment | \`${BRING_ENV_NAME}\` |"
            echo "| bringweb3 | \`${BRING_BACKEND_BRANCH}\` |"
            echo "| chromeExtension | \`${BRING_FRONTEND_BRANCH}\` |"
            echo

            if [ -f suite.log ]; then
              echo "### The suite"
              echo '```'
              # The verdict block run.py prints at the end.
              sed -n '/^=\{20,\}$/,$p' suite.log | tail -40
              echo '```'
            fi

            if [ -f walk.log ]; then
              echo "### The walk"
              echo '```'
              grep -E '^\[(ok |FAIL)\]|^   (ok|X) |^-- |^(PASS|FAIL) ' walk.log | tail -80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per shard, or the four jobs collide on one name and only the last
          # to finish keeps its evidence.
          name: failures-shard-${{ matrix.shard }}
          path: |
            artifacts/
            suite.log
            walk.log
            junit.xml
          retention-days: 30
          if-no-files-found: ignore

      # Both runs above are `continue-on-error` so that one failing does not
      # hide the other's results. The verdict is made here, once, on both.
      - name: Verdict
        if: always()
        run: |
          suite='${{ steps.suite.outcome }}'
          walk='${{ steps.walk.outcome }}'
          echo "suite: $suite    walk: $walk"
          if [ "$suite" = "failure" ] || [ "$walk" = "failure" ]; then
            echo "::error::Something the extension does is not what it should be. See the summary."
            exit 1
          fi
          echo "Safe to publish as far as this check can tell."
