name: Release check

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: 'bringweb3 branch to deploy'
        required: true
        default: 'main'
      frontend_branch:
        description: 'chromeExtension branch to deploy'
        required: true
        default: 'main'
      environment_name:
        description: 'Temporary environment to use or create'
        required: true
        default: 'qa-extension'
      retailers:
        description: 'Shops to test, comma separated (blank = the default four)'
        required: false
        default: ''
      scope:
        description: 'How much to run'
        required: true
        default: 'everything'
        type: choice
        options:
          - everything
          - popup and widget only
          - the walk only

permissions:
  id-token: write        # OIDC to AWS
  contents: read

jobs:
  check:
    name: Everything, against a fresh environment
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:

      BRING_ENV_NAME: ${{ github.event.inputs.environment_name }}
      BRING_BACKEND_BRANCH: ${{ github.event.inputs.backend_branch }}
      BRING_FRONTEND_BRANCH: ${{ github.event.inputs.frontend_branch }}
      BRING_RETAILERS: ${{ github.event.inputs.retailers }}
      BRING_HEADLESS: '1'
      ECKO_API_KEY: ${{ secrets.ECKO_API_KEY }}
      AWS_REGION: eu-central-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: extension-e2e

      # Only needed to seed the notification variants. Without it those tests
      # skip with a reason and everything else runs, so it is optional rather
      # than a hard requirement.
      #
      # The key is read from `env`, not tested directly in `if`. The `secrets`
      # context is not available to an `if` expression, and the failure is not
      # a skipped step: the workflow will not parse, every job is dropped, and
      # the run reports "No jobs were run" with nothing to point at.
      - name: Database tunnel key
        env:
          DB_SSH_KEY: ${{ secrets.DB_SSH_KEY }}
          DB_SSH_HOST: ${{ secrets.DB_SSH_HOST }}
          DB_SSH_USER: ${{ secrets.DB_SSH_USER }}
        if: ${{ env.DB_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DB_SSH_KEY" > ~/.ssh/bring-db.pem
          chmod 600 ~/.ssh/bring-db.pem
          {
            echo "DB_SSH_HOST=$DB_SSH_HOST"
            echo "DB_SSH_USER=$DB_SSH_USER"
            echo "DB_SSH_PORT=22"
            echo "DB_SSH_KEY_PATH=$HOME/.ssh/bring-db.pem"
          } >> "$GITHUB_ENV"

      # The environment is brought up once, here, and reused by both runs
      # below. Deploying it twice would mean waiting out the domain caches
      # twice for no gain.
      - name: The suite
        id: suite
        if: ${{ github.event.inputs.scope != 'the walk only' }}
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.scope }}" = "popup and widget only" ]; then
            python -u run.py --headless -n 4 -m "popup or widget" | tee suite.log
          else
            python -u run.py --headless -n 4 | tee suite.log
          fi

      - name: The walk — every shop in step, in one browser
        id: walk
        if: ${{ github.event.inputs.scope != 'popup and widget only' }}
        continue-on-error: true
        run: python -u flow.py --headless | tee walk.log

      - name: What happened
        if: always()
        run: |
          # The summary answers one question first — is this safe to publish —
          # and only then explains itself. A wall of green ticks buries the one
          # line that matters, so passing checks are counted, not listed.
          {
            suite_line=$(grep -hoE "[0-9]+ (of [0-9]+ checks failed|checks passed)[^|]*" suite.log 2>/dev/null | tail -1)
            failed=$(grep -cE "^  x " suite.log 2>/dev/null || echo 0)
            walk_failed=$(grep -cE "^\[FAIL\]" walk.log 2>/dev/null || echo 0)
            total=$((failed + walk_failed))

            if [ "$total" -eq 0 ]; then
              echo "# ✅ Safe to publish"
              echo
              echo "Everything the tool checks passed."
            else
              echo "# ❌ $total problem(s) — do not publish yet"
            fi
            echo
            echo "\`${BRING_ENV_NAME}\` · bringweb3 \`${BRING_BACKEND_BRANCH}\` · chromeExtension \`${BRING_FRONTEND_BRANCH}\`"
            echo

            # ── what broke, and nothing else ──────────────────────────
            if [ "$total" -gt 0 ]; then
              echo "## What broke"
              echo
              if [ "$failed" -gt 0 ]; then
                # Each failure is two lines in run.py's verdict: the name, then
                # the reason. Paired here so the reason is readable without
                # opening the log.
                grep -A 1 "^  x " suite.log \
                  | sed -e 's/^  x tests\.\(.*\)/\n**\1**/' \
                        -e 's/^      \(.*\)/\1/' -e '/^--$/d'
                echo
              fi
              if [ "$walk_failed" -gt 0 ]; then
                echo "### In the walk"
                grep -A 4 "^\[FAIL\]" walk.log | sed -e 's/^\[FAIL\] /\n**/' \
                  -e 's/   (\([0-9]*s\))$/** (\1)/' -e '/^--$/d'
                echo
              fi
              echo "Screenshots, storage dumps and Playwright traces for every"
              echo "failure are in **Artifacts** at the top of this page."
              echo
            fi

            # ── the counts, for the record ────────────────────────────
            echo "## The numbers"
            echo
            echo "| | |"
            echo "|---|---|"
            [ -n "$suite_line" ] && echo "| suite | $suite_line |"
            walk_ok=$(grep -cE "^\[ok \]" walk.log 2>/dev/null || echo 0)
            echo "| walk | $walk_ok step(s) passed, $walk_failed failed |"
            skipped=$(grep -oE "[0-9]+ skipped" suite.log 2>/dev/null | tail -1)
            [ -n "$skipped" ] && echo "| not run | $skipped |"
            echo

            if [ -n "$skipped" ]; then
              echo "<details><summary>Why some checks did not run</summary>"
              echo
              echo '```'
              grep -hoE "SKIPPED.*" suite.log 2>/dev/null | sed 's/SKIPPED //' \
                | sort | uniq -c | sort -rn | head -10
              echo '```'
              echo "</details>"
              echo
            fi

            echo "<details><summary>The walk, step by step</summary>"
            echo
            echo '```'
            grep -E "^\[(ok |FAIL)\]|^   (ok|X) |^-- " walk.log 2>/dev/null | tail -90
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failures
          path: |
            artifacts/
            suite.log
            walk.log
            junit.xml
          retention-days: 30
          if-no-files-found: ignore

      # Both runs above are `continue-on-error` so that one failing does not
      # hide the other's results. The verdict is made here, once, on both.
      - name: Verdict
        if: always()
        run: |
          suite='${{ steps.suite.outcome }}'
          walk='${{ steps.walk.outcome }}'
          echo "suite: $suite    walk: $walk"
          if [ "$suite" = "failure" ] || [ "$walk" = "failure" ]; then
            echo "::error::Something the extension does is not what it should be. See the summary."
            exit 1
          fi
          echo "Safe to publish as far as this check can tell."
