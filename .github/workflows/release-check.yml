name: Release check

on:
  workflow_dispatch:
    inputs:
      backend_branch:
        description: 'bringweb3 branch to deploy'
        required: true
        default: 'main'
      frontend_branch:
        description: 'chromeExtension branch to deploy'
        required: true
        default: 'main'
      environment_name:
        description: 'Temporary environment to use or create'
        required: true
        default: 'qa-extension'
      retailers:
        description: 'Shops to test, comma separated (blank = the default three)'
        required: false
        default: ''
      only:
        description: 'How much to run'
        required: true
        default: 'everything'
        type: choice
        options:
          - everything
          - popup
          - optout
          - standdown
          - followups
          - wallet
          - widget
          - offerbar
          - notifications

permissions:
  id-token: write        # OIDC to AWS
  contents: read

jobs:
  check:
    name: The walk, against a fresh environment
    runs-on: ubuntu-latest
    timeout-minutes: 75

    env:
      BRING_ENV_NAME: ${{ github.event.inputs.environment_name }}
      BRING_BACKEND_BRANCH: ${{ github.event.inputs.backend_branch }}
      BRING_FRONTEND_BRANCH: ${{ github.event.inputs.frontend_branch }}
      BRING_RETAILERS: ${{ github.event.inputs.retailers }}
      BRING_HEADLESS: '1'
      ECKO_API_KEY: ${{ secrets.ECKO_API_KEY }}
      AWS_REGION: eu-central-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: extension-e2e

      # Only needed to seed the notification variants. Without it those steps
      # say why they could not run and everything else runs.
      #
      # The key is read from `env`, not tested directly in `if`. The `secrets`
      # context is not available to an `if` expression, and the failure is not
      # a skipped step: the workflow will not parse, every job is dropped, and
      # the run reports "No jobs were run" with nothing to point at.
      - name: Database tunnel key
        env:
          DB_SSH_KEY: ${{ secrets.DB_SSH_KEY }}
          DB_SSH_HOST: ${{ secrets.DB_SSH_HOST }}
          DB_SSH_USER: ${{ secrets.DB_SSH_USER }}
        if: ${{ env.DB_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$DB_SSH_KEY" > ~/.ssh/bring-db.pem
          chmod 600 ~/.ssh/bring-db.pem
          {
            echo "DB_SSH_HOST=$DB_SSH_HOST"
            echo "DB_SSH_USER=$DB_SSH_USER"
            echo "DB_SSH_PORT=22"
            echo "DB_SSH_KEY_PATH=$HOME/.ssh/bring-db.pem"
          } >> "$GITHUB_ENV"

      - name: The walk
        id: walk
        continue-on-error: true
        run: |
          only='${{ github.event.inputs.only }}'
          if [ -n "$only" ] && [ "$only" != "everything" ]; then
            python -u run.py --headless --only "$only" | tee walk.log
          else
            python -u run.py --headless | tee walk.log
          fi
          exit "${PIPESTATUS[0]}"

      - name: What happened
        if: always()
        run: |
          # The summary answers one question first — is this safe to publish —
          # and only then explains itself.
          {
            # One place that counts, because `grep -c` prints its count and
            # *also* exits 1 when the count is zero.
            count() {
              [ -f "$2" ] || { echo 0; return; }
              local n
              n=$(grep -cE "$1" "$2" 2>/dev/null || true)
              echo "${n:-0}"
            }
            failed=$(count "^\[FAIL\]" walk.log)
            passed=$(count "^\[ok \]" walk.log)
            blocked=$(count "^ +ok .* -- " walk.log)

            if grep -qE "^Cannot (test|walk)" walk.log; then
              echo "# ⚠️ Did not run"
              echo
              grep -E "^Cannot (test|walk)" -A 3 walk.log
            elif [ "$failed" -eq 0 ]; then
              echo "# ✅ Safe to publish"
              echo
              echo "Every step the walk takes did what it should."
            else
              echo "# ❌ $failed step(s) went wrong — do not publish yet"
            fi
            echo
            echo "\`${BRING_ENV_NAME}\` · bringweb3 \`${BRING_BACKEND_BRANCH}\` · chromeExtension \`${BRING_FRONTEND_BRANCH}\`"
            echo

            if [ "$failed" -gt 0 ]; then
              echo "## What broke"
              echo
              grep -A 4 "^\[FAIL\]" walk.log | sed -e 's/^\[FAIL\] /\n**/' \
                -e 's/   (\([0-9]*s\))$/** (\1)/' -e '/^--$/d'
              echo
              echo "Screenshots and storage dumps for every failed step are in"
              echo "**Artifacts** at the top of this page."
              echo
            fi

            echo "## The numbers"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| steps passed | $passed |"
            echo "| steps failed | $failed |"
            [ "$blocked" -gt 0 ] && echo "| could not be observed (bot check, results page not recognised) | $blocked |"
            echo

            if [ "$blocked" -gt 0 ]; then
              echo "<details><summary>What could not be observed, and why</summary>"
              echo
              echo '```'
              grep -E "^ +ok .* -- " walk.log | sed -E 's/^ +ok //'
              echo '```'
              echo "</details>"
              echo
            fi

            echo "<details><summary>The walk, step by step</summary>"
            echo
            echo '```'
            grep -E "^=+$|^ACT |^\[(ok |FAIL)\]|^ +(ok|X) |^-- " walk.log 2>/dev/null
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            artifacts/
            walk.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Verdict
        if: always()
        run: |
          if [ '${{ steps.walk.outcome }}' = 'failure' ]; then
            echo "::error::Something the extension does is not what it should be. See the summary."
            exit 1
          fi
          echo "Safe to publish as far as this check can tell."
